<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Robot Dubins Car</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        h1 { font-size: 20px; margin-bottom: 16px; }

        /* Layout de 3 columnas */
        .contenedor {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        canvas {
            background: #f5f5f0;
            border-radius: 8px;
            border: 1px solid #ccc;
            flex-shrink: 0;
            outline: none;
        }

        /* Paneles laterales */
        .panel-izq, .panel-der {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 200px;
            flex-shrink: 0;
        }

        .caja { background: #2a2a2a; border-radius: 8px; padding: 12px; font-size: 13px; }
        .caja h3 { font-size: 11px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

        /* Badges de estado */
        .estado-fila-top { display: flex; gap: 6px; }
        .estado-badge { flex: 1; border-radius: 6px; padding: 6px 4px; font-size: 11px; text-align: center; font-weight: bold; }
        .badge-detenido  { background: #6a4a2d; color: #ffcc7f; }
        .badge-moviendo  { background: #1a4a7a; color: #7fbfff; }
        .badge-seguro    { background: #2d6a2d; color: #7fff7f; }
        .badge-peligroso { background: #8b0000; color: #ffaaaa; }

        /* Filas de datos */
        .dato-fila { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #333; font-size: 12px; }
        .dato-fila:last-child { border-bottom: none; }
        .dato-val { font-weight: bold; }

        /* Teclas */
        .teclas { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; justify-content: center; margin-top: 6px; }
        .key { width: 44px; height: 44px; background: #333; border: 1px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: background 0.1s; user-select: none; }
        .key.active { background: #1a73e8; border-color: #1a73e8; }
        .key.vacio { background: transparent; border: none; cursor: default; }

        /* Botones y selects */
        button { background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 12px; width: 100%; }
        button:hover:not(:disabled) { background: #444; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        select { background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 6px; font-size: 12px; width: 100%; outline: none; }
        input[type=number] { background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 5px; font-size: 12px; width: 60px; text-align: center; outline: none; }
        .fila { display: flex; align-items: center; gap: 8px; }
        label { font-size: 11px; color: #aaa; }

        /* Selector de control */
        .control-btn { background: #333; color: #aaa; border: 1px solid #555; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 12px; text-align: left; width: 100%; transition: all 0.15s; margin-bottom: 5px; }
        .control-btn:hover { background: #444; }
        .control-btn.activo { background: #1a4a7a; color: #7fbfff; border-color: #3a6a9a; font-weight: bold; }
        .control-btn.activo-control { background: #4a1a1a; color: #ffaaaa; border-color: #8b0000; font-weight: bold; }

        /* Leyenda */
        .leyenda { display: flex; gap: 8px; align-items: center; font-size: 11px; margin-top: 6px; }
        .leyenda-color { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

        /* Aviso colisión */
        .colision-aviso { background: #c0392b; border-radius: 8px; padding: 8px; text-align: center; font-weight: bold; font-size: 12px; display: none; }

        /* HJR estado */
        .hjr-estado { font-size: 11px; color: #aaa; text-align: center; margin-top: 4px; }
        .hjr-listo { color: #7fff7f; }
    </style>
</head>
<body>
    <h1>Robot Dubins Car</h1>
    <div class="contenedor">

        <!-- PANEL IZQUIERDO: datos en vivo -->
        <div class="panel-izq">

            <div class="estado-fila-top">
                <div class="estado-badge badge-detenido" id="badge-movimiento">⏹ Detenido</div>
                <div class="estado-badge badge-seguro"   id="badge-peligro">✅ Seguro</div>
            </div>

            <div class="caja">
                <h3>Estado del robot</h3>
                <div class="dato-fila"><span>X</span><span class="dato-val" id="s-x">0.000</span></div>
                <div class="dato-fila"><span>Y</span><span class="dato-val" id="s-y">0.000</span></div>
                <div class="dato-fila"><span>Ángulo</span><span class="dato-val" id="s-theta">0.0°</span></div>
                <div class="dato-fila"><span>V</span><span class="dato-val" id="s-v">0 m/s</span></div>
                <div class="dato-fila"><span>W</span><span class="dato-val" id="s-w">0 rad/s</span></div>
            </div>

            <div class="caja">
                <h3>HJR</h3>
                <div class="dato-fila"><span>BRT valor</span><span class="dato-val" id="s-brt">—</span></div>
                <div class="dato-fila"><span>W control</span><span class="dato-val" id="s-wctrl">—</span></div>
                <div class="hjr-estado" id="hjr-estado-txt">⏳ Cargando BRT...</div>
            </div>

            <div class="caja">
                <h3>Leyenda</h3>
                <div class="leyenda"><div class="leyenda-color" style="background:rgba(220,20,20,0.8)"></div><span>Peligroso</span></div>
                <div class="leyenda" style="margin-top:4px;"><div class="leyenda-color" style="background:rgba(144,238,144,0.5)"></div><span>Seguro</span></div>
            </div>

            <div class="colision-aviso" id="aviso-colision">⚠️ Colisión</div>

            <button id="btn-reiniciar" onclick="resetear()">Reiniciar robot</button>

        </div>

        <!-- CANVAS central -->
        <canvas id="canvas" width="600" height="600"></canvas>

        <!-- PANEL DERECHO: controles -->
        <div class="panel-der">

            <div class="caja">
                <h3>Modo</h3>
                <select id="modo" onchange="cambiarModo()">
                    <option value="manual">Manual (teclado)</option>
                    <option value="automatico">Automático</option>
                </select>
            </div>

            <!-- Panel manual -->
            <div class="caja" id="panel-manual">
                <h3>Control</h3>
                <div class="fila" style="margin-bottom:8px;">
                    <label>V fija:</label>
                    <span style="color:#7fff7f; font-weight:bold;">5.0 m/s</span>
                </div>
                <div class="teclas">
                    <div class="key vacio"></div>
                    <div class="key" id="key-up">▲</div>
                    <div class="key vacio"></div>
                    <div class="key" id="key-left">◀</div>
                    <div class="key" id="key-down">▼</div>
                    <div class="key" id="key-right">▶</div>
                </div>
            </div>

            <!-- Panel automático -->
            <div class="caja" id="panel-auto" style="display:none;">
                <h3>Destino</h3>
                <div class="fila"><label>X:</label><input type="number" id="x-fin" value="5" step="0.5"></div>
                <div class="fila" style="margin-top:4px;"><label>Y:</label><input type="number" id="y-fin" value="5" step="0.5"></div>
                <div class="fila" style="margin-top:4px;"><label>θ:</label><input type="number" id="theta-fin" value="0" step="0.1"></div>
                <br>
                <button id="btn-calcular" onclick="enviarAutomatico()">Calcular trayectoria</button>
            </div>

            <!-- Selector de modo de control -->
            <div class="caja">
                <h3>Modo de control</h3>
                <button class="control-btn activo"    id="btn-sin-control" onclick="cambiarModoControl('manual')">🕹️ Sin control</button>
                <button class="control-btn"           id="btn-lrf"    onclick="cambiarModoControl('lrf')">🛡️ LRF</button>
                <button class="control-btn"           id="btn-cbf"    onclick="cambiarModoControl('cbf')">🔬 CBF</button>
                <button class="control-btn"           id="btn-apf"    onclick="cambiarModoControl('apf')">🧲 APF</button>
            </div>

        </div>

    </div>

<script>
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const LIMITE = 20.0;
const ESCALA = W / (LIMITE * 2);
const V_FIJA = 5.0;

const obstaculos_rect = [
    { x:  10.0, y: 14.0,  w: 12.0, h: 4.0,  ang: 0 },
    { x: -5.0,  y: -10.0, w: 4.0,  h: 8.0,  ang: 0 },
    { x:  10.0, y: -10.0, w: 8.0,  h: 4.0,  ang: 0 },
];
const obstaculos_circ = [
    { x: -14.0, y: 12.0, r: 2.5 },
];

let ws;
let trayectoria  = [];
let estadoActual = { x: 0, y: 0, theta: 0, v: 0, w: 0 };
let loop;
let robotActivo  = false;
let hjrData      = null;
let hjrListo     = false;
let hjrPollTimer = null;

// Modo de control activo
let modoControl = 'manual';

function cambiarModoControl(modo) {
    modoControl = modo;
    document.getElementById('btn-sin-control').className = 'control-btn' + (modo === 'manual' ? ' activo' : '');
    document.getElementById('btn-lrf').className         = 'control-btn' + (modo === 'lrf'    ? ' activo-control' : '');
    document.getElementById('btn-cbf').className         = 'control-btn' + (modo === 'cbf'    ? ' activo-control' : '');
    document.getElementById('btn-apf').className         = 'control-btn' + (modo === 'apf'    ? ' activo-control' : '');
    if (ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ tipo: 'modo_control', valor: modo }));
}

// Control del BRT dinámico
let thetaUltimoFetch = null;
let fetchEnCurso     = false;

const baseUrl = window.location.hostname === "localhost"
    ? "http://localhost:8000"
    : "https://robot-dubins.onrender.com";

function mundoACanvas(x, y) {
    return { cx: W/2 + x * ESCALA, cy: H/2 - y * ESCALA };
}

function redondearTheta(thetaRad) {
    let deg = thetaRad * 180 / Math.PI;
    deg = ((deg + 180) % 360 + 360) % 360 - 180;
    return Math.round(deg / 5) * 5;
}

function valorBRTenPosicion(x, y) {
    if (!hjrData) return null;
    const { xs, ys, corte } = hjrData;
    const nx = xs.length, ny = ys.length;
    const fi = (x - xs[0]) / (xs[nx-1] - xs[0]) * (nx - 1);
    const fj = (y - ys[0]) / (ys[ny-1] - ys[0]) * (ny - 1);
    const i0 = Math.max(0, Math.min(nx-2, Math.floor(fi)));
    const j0 = Math.max(0, Math.min(ny-2, Math.floor(fj)));
    const tx = fi - i0, ty = fj - j0;
    const v00 = corte[i0][j0],   v10 = corte[i0+1][j0];
    const v01 = corte[i0][j0+1], v11 = corte[i0+1][j0+1];
    return (1-tx)*(1-ty)*v00 + tx*(1-ty)*v10 + (1-tx)*ty*v01 + tx*ty*v11;
}

async function actualizarBRT(thetaDeg) {
    if (fetchEnCurso) return;
    fetchEnCurso = true;
    try {
        const resp = await fetch(`${baseUrl}/hjr?theta=${thetaDeg}&v=5.0&modo=backward`);
        hjrData = await resp.json();
    } catch(e) { console.error("Error BRT:", e); }
    fetchEnCurso = false;
}

function iniciarPollingHJR() {
    hjrPollTimer = setInterval(async () => {
        try {
            const resp = await fetch(`${baseUrl}/hjr_estado`);
            const data = await resp.json();
            if (data.listo && !hjrListo) {
                hjrListo = true;
                clearInterval(hjrPollTimer);
                document.getElementById("hjr-estado-txt").textContent = "✅ BRT listo";
                document.getElementById("hjr-estado-txt").className   = "hjr-estado hjr-listo";
                await actualizarBRT(0);
                thetaUltimoFetch = 0;
                dibujar();
            }
        } catch(e) {}
    }, 5000);
}

function bloquearPanel() {
    robotActivo = true;
    document.getElementById("modo").disabled      = true;
    document.getElementById("x-fin").disabled     = true;
    document.getElementById("y-fin").disabled     = true;
    document.getElementById("theta-fin").disabled = true;
    const btnCalc = document.getElementById("btn-calcular");
    if (btnCalc) btnCalc.disabled = true;
    const el = document.getElementById("badge-movimiento");
    el.textContent = "▶ Movimiento";
    el.className   = "estado-badge badge-moviendo";
    canvas.focus();
}

function desbloquearPanel() {
    robotActivo = false;
    document.getElementById("modo").disabled      = false;
    document.getElementById("x-fin").disabled     = false;
    document.getElementById("y-fin").disabled     = false;
    document.getElementById("theta-fin").disabled = false;
    const btnCalc = document.getElementById("btn-calcular");
    if (btnCalc) btnCalc.disabled = false;
    const el = document.getElementById("badge-movimiento");
    el.textContent = "⏹ Detenido";
    el.className   = "estado-badge badge-detenido";
}

function conectar() {
    const wsUrl = window.location.hostname === "localhost"
        ? "ws://localhost:8000/ws"
        : "wss://robot-dubins.onrender.com/ws";
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
        console.log("Conectado");
        ws.send(JSON.stringify({ tipo: "velocidad", valor: V_FIJA }));
        ws.send(JSON.stringify({ tipo: "modo_control", valor: modoControl }));
        iniciarLoop();
        iniciarPollingHJR();
    };
    ws.onmessage = async (e) => {
        const data   = JSON.parse(e.data);
        estadoActual = data;
        trayectoria  = data.trayectoria || [];

        if (data.activo && !robotActivo) bloquearPanel();
        if (!data.activo && robotActivo) desbloquearPanel();

        if (data.hjr_listo && !hjrListo) {
            hjrListo = true;
            clearInterval(hjrPollTimer);
            document.getElementById("hjr-estado-txt").textContent = "✅ BRT listo";
            document.getElementById("hjr-estado-txt").className   = "hjr-estado hjr-listo";
            await actualizarBRT(0);
            thetaUltimoFetch = 0;
        }

        // Actualizar BRT si el ángulo cambió más de 5°
        if (hjrListo && !fetchEnCurso) {
            const thetaDegRedondeado = redondearTheta(estadoActual.theta);
            if (thetaDegRedondeado !== thetaUltimoFetch) {
                thetaUltimoFetch = thetaDegRedondeado;
                actualizarBRT(thetaDegRedondeado);
            }
        }

        // Mostrar valor BRT
        const brtVal = valorBRTenPosicion(estadoActual.x, estadoActual.y);
        const brtEl  = document.getElementById("s-brt");
        if (brtVal !== null) {
            brtEl.textContent = brtVal.toFixed(3);
            brtEl.style.color = brtVal < 0 ? "#ff4444" : "#7fff7f";
            const badgeP = document.getElementById("badge-peligro");
            if (brtVal < 0) {
                badgeP.textContent = "⚠️ Peligroso";
                badgeP.className   = "estado-badge badge-peligroso";
            } else {
                badgeP.textContent = "✅ Seguro";
                badgeP.className   = "estado-badge badge-seguro";
            }
        } else {
            brtEl.textContent = "—";
            brtEl.style.color = "#aaa";
        }

        // Mostrar W control bang-bang
        const wCtrlEl = document.getElementById("s-wctrl");
        if (data.modo_control === 'lrf' && data.peligroso) {
            wCtrlEl.textContent = (data.w_control?.toFixed(2) ?? "—") + " rad/s";
            wCtrlEl.style.color = "#ffaaaa";
        } else {
            wCtrlEl.textContent = "—";
            wCtrlEl.style.color = "#aaa";
        }

        dibujar();
        actualizarEstado();
        if (data.colision) mostrarColision();
    };
    ws.onclose = () => { clearInterval(loop); setTimeout(conectar, 1000); };
}

function iniciarLoop() {
    loop = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ tipo: "tick" }));
    }, 100);
}

function dibujarHJR() {
    if (!hjrData) return;
    const { xs, ys, corte } = hjrData;
    const nx = xs.length, ny = ys.length;

    const imageData = ctx.createImageData(W, H);
    const data = imageData.data;

    for (let px = 0; px < W; px++) {
        for (let py = 0; py < H; py++) {
            const wx =  (px - W/2) / ESCALA;
            const wy = -(py - H/2) / ESCALA;
            const fi = (wx - xs[0]) / (xs[nx-1] - xs[0]) * (nx - 1);
            const fj = (wy - ys[0]) / (ys[ny-1] - ys[0]) * (ny - 1);
            const i0 = Math.max(0, Math.min(nx-2, Math.floor(fi)));
            const j0 = Math.max(0, Math.min(ny-2, Math.floor(fj)));
            const tx = fi - i0, ty = fj - j0;
            const v00 = corte[i0][j0],   v10 = corte[i0+1][j0];
            const v01 = corte[i0][j0+1], v11 = corte[i0+1][j0+1];
            const val = (1-tx)*(1-ty)*v00 + tx*(1-ty)*v10
                      + (1-tx)*ty*v01     + tx*ty*v11;
            const idx4 = (py * W + px) * 4;
            if (val < 0) {
                const intensidad = Math.min(1.0, Math.abs(val) / 2.5);
                const alpha = Math.round((0.55 + intensidad * 0.45) * 255);
                data[idx4]=220; data[idx4+1]=20; data[idx4+2]=20; data[idx4+3]=alpha;
            } else {
                data[idx4]=144; data[idx4+1]=238; data[idx4+2]=144; data[idx4+3]=50;
            }
        }
    }
    ctx.putImageData(imageData, 0, 0);

    // Contorno BRT
    ctx.beginPath();
    ctx.strokeStyle = "rgba(160,0,0,0.9)";
    ctx.lineWidth   = 1.5;
    for (let i = 0; i < nx-1; i++) {
        for (let j = 0; j < ny-1; j++) {
            const v00=corte[i][j], v10=corte[i+1][j], v01=corte[i][j+1], v11=corte[i+1][j+1];
            const neg = (v00<0)+(v10<0)+(v01<0)+(v11<0);
            if (neg>0 && neg<4) {
                if ((v00<0)!==(v10<0)) { const t=v00/(v00-v10); const {cx,cy}=mundoACanvas(xs[i]+t*(xs[i+1]-xs[i]),ys[j]); ctx.moveTo(cx-1,cy); ctx.lineTo(cx+1,cy); }
                if ((v01<0)!==(v11<0)) { const t=v01/(v01-v11); const {cx,cy}=mundoACanvas(xs[i]+t*(xs[i+1]-xs[i]),ys[j+1]); ctx.moveTo(cx-1,cy); ctx.lineTo(cx+1,cy); }
                if ((v00<0)!==(v01<0)) { const t=v00/(v00-v01); const {cx,cy}=mundoACanvas(xs[i],ys[j]+t*(ys[j+1]-ys[j])); ctx.moveTo(cx,cy-1); ctx.lineTo(cx,cy+1); }
                if ((v10<0)!==(v11<0)) { const t=v10/(v10-v11); const {cx,cy}=mundoACanvas(xs[i+1],ys[j]+t*(ys[j+1]-ys[j])); ctx.moveTo(cx,cy-1); ctx.lineTo(cx,cy+1); }
            }
        }
    }
    ctx.stroke();
}

function dibujar() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f5f5f0";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(0,0,0,0.08)";
    ctx.lineWidth   = 0.5;
    for (let x = 0; x < W; x += ESCALA*5) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += ESCALA*5) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    ctx.strokeStyle = "#222";
    ctx.lineWidth   = 4;
    ctx.strokeRect(2, 2, W-4, H-4);

    dibujarHJR();

    obstaculos_rect.forEach((obs, i) => {
        const {cx,cy} = mundoACanvas(obs.x, obs.y);
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(-obs.ang*Math.PI/180);
        ctx.fillStyle = i===0 ? "#222" : "#2e7d9e";
        ctx.fillRect(-obs.w/2*ESCALA, -obs.h/2*ESCALA, obs.w*ESCALA, obs.h*ESCALA);
        ctx.restore();
    });

    obstaculos_circ.forEach(obs => {
        const {cx,cy} = mundoACanvas(obs.x, obs.y);
        ctx.beginPath(); ctx.arc(cx,cy,obs.r*ESCALA,0,2*Math.PI);
        ctx.fillStyle="#2e7d9e"; ctx.fill();
    });

    if (trayectoria.length > 1) {
        ctx.beginPath(); ctx.strokeStyle="#e74c3c"; ctx.lineWidth=1.5;
        const p0=mundoACanvas(trayectoria[0][0],trayectoria[0][1]);
        ctx.moveTo(p0.cx,p0.cy);
        for (let i=1;i<trayectoria.length;i++) { const p=mundoACanvas(trayectoria[i][0],trayectoria[i][1]); ctx.lineTo(p.cx,p.cy); }
        ctx.stroke();
    }

    const {cx,cy} = mundoACanvas(estadoActual.x, estadoActual.y);
    const theta   = estadoActual.theta;
    const brtVal  = valorBRTenPosicion(estadoActual.x, estadoActual.y);
    const colorRobot = (brtVal!==null && brtVal<0) ? "#ff2222" : "#1a73e8";

    ctx.beginPath(); ctx.fillStyle=colorRobot; ctx.arc(cx,cy,8,0,2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.strokeStyle="#fff"; ctx.lineWidth=2.5;
    ctx.moveTo(cx,cy); ctx.lineTo(cx+14*Math.cos(theta), cy-14*Math.sin(theta)); ctx.stroke();
}

function actualizarEstado() {
    document.getElementById("s-x").textContent     = estadoActual.x;
    document.getElementById("s-y").textContent     = estadoActual.y;
    document.getElementById("s-theta").textContent = (estadoActual.theta*180/Math.PI).toFixed(1)+"°";
    document.getElementById("s-v").textContent     = estadoActual.v+" m/s";
    document.getElementById("s-w").textContent     = estadoActual.w+" rad/s";
}

function mostrarColision() {
    const aviso = document.getElementById("aviso-colision");
    aviso.style.display = "block";
    setTimeout(() => aviso.style.display="none", 2000);
}

const keyMap = { "ArrowUp":"key-up","ArrowDown":"key-down","ArrowLeft":"key-left","ArrowRight":"key-right" };
document.addEventListener("keydown", (e) => {
    if (!keyMap[e.key]) return;
    e.preventDefault(); if (e.repeat) return;
    document.getElementById(keyMap[e.key])?.classList.add("active");
    if (e.key==="ArrowUp"    && !robotActivo && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"tecla",tecla:"ArrowUp"}));
    if (e.key==="ArrowDown"  && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"tecla",tecla:"ArrowDown"}));
    if (e.key==="ArrowLeft"  && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"giro",valor:1.5}));
    if (e.key==="ArrowRight" && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"giro",valor:-1.5}));
});
document.addEventListener("keyup", (e) => {
    if (!keyMap[e.key]) return;
    e.preventDefault();
    document.getElementById(keyMap[e.key])?.classList.remove("active");
    if ((e.key==="ArrowLeft"||e.key==="ArrowRight") && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"giro",valor:0.0}));
});

function resetear() {
    trayectoria=[]; hjrData=null; thetaUltimoFetch=null;
    desbloquearPanel();
    if (ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"reset"}));
    dibujar();
}

function cambiarModo() {
    const modo = document.getElementById("modo").value;
    document.getElementById("panel-manual").style.display = modo==="manual"     ? "block" : "none";
    document.getElementById("panel-auto").style.display   = modo==="automatico" ? "block" : "none";
}

function enviarAutomatico() {
    const x_fin=parseFloat(document.getElementById("x-fin").value);
    const y_fin=parseFloat(document.getElementById("y-fin").value);
    const theta_fin=parseFloat(document.getElementById("theta-fin").value);
    if (ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({tipo:"automatico",x_fin,y_fin,theta_fin}));
}

conectar();
